services:
  redis:
    image: redis:7-alpine
    container_name: devpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devpilot-backend
    ports:
      - "8000:7860"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
    volumes:
      - .:/app
      # Docker-out-of-Docker: Mount docker socket to allow the backend 
      # to spin up isolated container runtimes for safe agent code execution.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: devpilot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  redis_data:
